<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0d0f12" />
  <!-- Standalone / full-screen when added to the home screen (iOS + Android). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="lines" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>lines</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Bottom layer: the clean plate (revealed as you wipe) -->
  <canvas id="clean" aria-hidden="true"></canvas>
  <!-- Top layer: the powder (erased along the finger path) -->
  <canvas id="powder" aria-hidden="true"></canvas>
  <script src="main.js"></script>
</body>
</html>
